services:

  db:
    image: postgres:16

    container_name: expense_management_db

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: .

    container_name: expense_management_backend

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: 5432

    ports:
      - "8080:8080"

    volumes:
      - ./uploads:/app/uploads


volumes:
  postgres_data: